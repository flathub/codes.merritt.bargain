# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json
# Reference docs: https://docs.flatpak.org/en/latest/flatpak-builder-command-reference.html#flatpak-manifest

---
app-id: codes.merritt.bargain
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: unit_bargain_hunter
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
modules:
  # libappindicator
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  # Unit Bargain Hunter
  - name: unit_bargain_hunter
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - ./build-flatpak.sh
    sources:
      - type: file
        url: https://github.com/Merrit/unit_bargain_hunter/releases/download/v1.17.0/UnitBargainHunter-Linux-Portable.tar.gz
        sha256: 2923164040e637efa7ed080f3fd8ef745f56bd70d9bac378de7bf705c30a16b3
      - type: git
        url: https://github.com/Merrit/unit_bargain_hunter.git
        commit: 5fbfc836f1eb84add0cea1b43c3a44b6ebaae12b
      - type: file
        path: build-flatpak.sh
